<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عقارك | عقارات ليبيا</title>
<meta name="theme-color" content="#18181b">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g:#18181b;--g2:#0e0e10;--b:#e0a526;--gd:#9a6a08;--ink:#18181b;--bg:#f4f4f5;--w:#fff;--ln:#dcdce0;--mut:#62626b}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--b)}
.hl{height:46px;width:auto;display:block}
.lg{display:flex;justify-content:center;margin:6px 0 14px}
.lg img{width:200px;height:200px;filter:drop-shadow(0 8px 18px #0008)}
.btn.g.fab{background:var(--b);color:#1a1405}
.tabs button.on{background:var(--b)!important;color:#1a1405!important;border-color:var(--b)!important}
.logo{font-size:26px;font-weight:800;letter-spacing:0}
.logo i{font-style:normal;color:var(--b)}
button,select,input,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--b);color:#1d1403}
.btn.g{background:var(--g);color:#fff}.btn.o{background:transparent;border:1.5px solid var(--g);color:var(--g)}
.btn.wa{background:#1fa855;color:#fff}.btn.r{background:#b3261e;color:#fff}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.hero{background:var(--g);color:#fff;padding:8px 16px 22px}
.hero h1{font-size:24px;font-weight:800;line-height:1.4;margin-bottom:6px}
.hero p{color:#cfcfd6;font-size:15px}
.tabs{display:flex;gap:8px;margin-top:14px}
.tabs button{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid #ffffff55;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.tabs button.on{background:#fff;color:var(--g);border-color:#fff}
.cats{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:84px;height:84px;padding:0;border:0;background:none;border-radius:22px;cursor:pointer;opacity:.92}
.cat img{width:100%;height:100%;display:block;border-radius:20px}
.cat.on{outline:3px solid var(--b);outline-offset:2px;opacity:1}
.vb{display:inline-block;background:#1f8f56;color:#fff;border-radius:6px;padding:1px 9px;font-size:13px;font-weight:800;margin-left:6px}
.vb.b2{margin:4px 0 8px;font-size:14px;padding:3px 12px}
.lnk{background:none;border:0;color:var(--gd);font-weight:800;text-decoration:underline;cursor:pointer;padding:6px;font-size:14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.filters select,.filters input,.f input,.f select,.f textarea{width:100%;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:#fff}
.count{padding:0 16px 6px;color:var(--mut);font-size:14px}
.grid{display:grid;gap:12px;padding:0 16px 90px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--w);border:1px solid var(--ln);border-radius:14px;overflow:hidden;cursor:pointer}
.card img,.ph{width:100%;height:170px;object-fit:cover;display:block;background:#dfe7e5}
.card .in{padding:12px}
.tag{display:inline-block;background:var(--b);color:#1a1405;border-radius:6px;padding:1px 9px;font-size:13px;font-weight:800;margin-left:6px}
.price{font-size:20px;font-weight:800;color:var(--gd)}
.mut{color:var(--mut);font-size:14px}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--mut)}
.fab{position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;margin:auto;box-shadow:0 6px 20px #0004;padding:14px;font-size:17px;z-index:4}
.modal{position:fixed;inset:0;background:#000a;z-index:10;display:none;overflow:auto}
.modal.on{display:block}
.sheet{background:var(--bg);max-width:640px;margin:0 auto;min-height:100%;padding:16px}
.sheet h2{font-size:22px;margin-bottom:10px}
.x{float:left;background:#fff;border:1px solid var(--ln);border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.f label{display:block;font-weight:500;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pm,#dm{height:230px;border-radius:12px;border:1px solid var(--ln);margin-top:6px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
.thumbs img{width:70px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none}
.big{width:100%;height:240px;object-fit:cover;border-radius:12px}
.note{background:#fff7e6;border:1px solid #ecd49b;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
.adm{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.adm .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.adm .bt .btn{padding:7px 12px;font-size:14px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:30;display:none}
</style>
</head>
<body>
<header><img class="hl" src="icon.png" alt="عقارك"><button class="btn wa" id="hwa">واتساب الإدارة</button></header>
<div id="pub">
<div class="hero"><div class="lg"><img src="icon-512.png" alt="عقارك"></div><h1>بيع، إيجار، أو انتفاع. كل عقارات ليبيا في مكان واحد</h1><p>كل عرض تراجعه الإدارة قبل النشر.</p>
<div class="tabs" id="tabs"><button class="on" data-d="">الكل</button><button data-d="بيع">بيع</button><button data-d="إيجار">إيجار</button><button data-d="انتفاع">انتفاع</button></div></div>
<div class="cats" id="cats"><button class="cat" data-k="بيت" aria-label="منازل"><img src="cat-homes.png" alt="منازل"></button><button class="cat" data-k="شقة" aria-label="شقق"><img src="cat-apartments.png" alt="شقق"></button><button class="cat" data-k="أرض" aria-label="أراضي"><img src="cat-land.png" alt="أراضي"></button><button class="cat" data-k="محل" aria-label="محلات"><img src="cat-shops.png" alt="محلات"></button><button class="cat" data-k="مكتب" aria-label="مكاتب"><img src="cat-offices.png" alt="مكاتب"></button><button class="cat" data-k="مستودع" aria-label="مستودعات"><img src="cat-warehouses.png" alt="مستودعات"></button></div>
<div class="filters"><select id="fc"><option value="">كل المدن</option></select><select id="fk"><option value="">كل الأنواع</option></select><input id="fp" type="number" inputmode="numeric" placeholder="أقصى سعر (د.ل)"><select id="fs"><option value="new">الأحدث</option><option value="lo">الأرخص</option><option value="hi">الأغلى</option></select></div>
<div class="count"><span id="cnt"></span> <button class="lnk" id="reqb">ما لقيت اللي تبيه؟ اطلب عقارك</button></div><div class="grid" id="grid"></div>
<button class="btn g fab" id="add">اعرض عقارك</button>
</div>

<div class="modal" id="dmod"><div class="sheet"><button class="x" data-close>×</button><div id="dbody"></div></div></div>

<div class="modal" id="amod"><div class="sheet f"><button class="x" data-close>×</button><h2>اعرض عقارك</h2>
<div class="note">طلبك يوصل للإدارة، وتتواصل معاك على واتساب وتتأكد من العقار قبل النشر. أول 30 مشترك مجاناً.</div>
<div class="row"><div><label>نوع العرض</label><select id="a_deal"><option>بيع</option><option>إيجار</option><option>انتفاع</option></select></div><div><label>نوع العقار</label><select id="a_cat"></select></div></div>
<div class="row"><div><label>المدينة</label><select id="a_city"></select></div><div><label>المنطقة / الحي</label><input id="a_area"></div></div>
<div class="row"><div><label>السعر</label><input id="a_price" type="number" inputmode="numeric"></div><div><label>العملة</label><select id="a_cur"><option value="LYD">دينار</option><option value="USD">دولار</option></select></div></div>
<label>وصف مختصر (المساحة، عدد الغرف...)</label><textarea id="a_desc" rows="3"></textarea>
<div class="row"><div><label>الاسم</label><input id="a_name"></div><div><label>رقم واتساب</label><input id="a_phone" type="tel" inputmode="tel" placeholder="09xxxxxxxx"></div></div>
<label>الصور (حتى 5)</label><input id="a_ph" type="file" accept="image/*" multiple>
<label>حدد موقع العقار على الخريطة (اضغط على الخريطة)</label>
<button class="btn o" id="loc" type="button">استخدم موقعي الحالي</button><div id="pm"></div>
<button class="btn g" id="send" style="width:100%;margin-top:14px;padding:14px">أرسل الطلب للإدارة</button></div></div>

<div class="modal" id="rmod"><div class="sheet f"><button class="x" data-close>×</button><h2>اطلب عقارك</h2>
<div class="note">اكتب اللي تدور عليه، والإدارة تتواصل معاك على واتساب لما يتوفر عقار مناسب.</div>
<div class="row"><div><label>تبي</label><select id="r_deal"><option>بيع</option><option>إيجار</option><option>انتفاع</option></select></div><div><label>نوع العقار</label><select id="r_cat"></select></div></div>
<div class="row"><div><label>المدينة</label><select id="r_city"></select></div><div><label>الميزانية (اختياري)</label><input id="r_budget" type="number" inputmode="numeric"></div></div>
<label>العملة</label><select id="r_cur"><option value="LYD">دينار</option><option value="USD">دولار</option></select>
<label>تفاصيل الطلب (المنطقة، المساحة، عدد الغرف...)</label><textarea id="r_notes" rows="3"></textarea>
<div class="row"><div><label>الاسم</label><input id="r_name"></div><div><label>رقم واتساب</label><input id="r_phone" type="tel" inputmode="tel" placeholder="09xxxxxxxx"></div></div>
<button class="btn g" id="rsend" style="width:100%;margin-top:14px;padding:14px">أرسل الطلب</button></div></div>

<div class="modal" id="adm"><div class="sheet"><button class="x" data-close>×</button><h2>لوحة الإدارة</h2><div id="abody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://mysklneckgsdyrilgwge.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15c2tsbmVja2dzZHlyaWxnd2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0NDc1NDYsImV4cCI6MjExMTAyMzU0Nn0.c3M09fhOqOt5saB_fGWOBOOP9YtexP2VRsQIQTgF57Q',ADMIN_WA='218940510551',FREE=30;
const sb=supabase.createClient(SB_URL,SB_KEY);
const CITIES=['طرابلس','بنغازي','مصراتة','زليتن','الخمس','الزاوية','صبراتة','صرمان','غريان','ترهونة','بني وليد','مسلاتة','تاجوراء','زوارة','نالوت','سرت','أجدابيا','البيضاء','المرج','درنة','طبرق','سبها','أوباري','مرزق','غات','الكفرة','أخرى'];
const CATS=['بيت','شقة','أرض','محل','مكتب','مستودع','مزرعة','أخرى'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display="none",7000)};
const wa=p=>{p=String(p).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='218'+p.slice(1);return p};
const money=l=>l.price?Number(l.price).toLocaleString('ar-LY')+(l.currency=='USD'?' دولار':' د.ل'):'السعر بالتواصل';
const opts=(el,arr,first)=>el.innerHTML=(first?`<option value="">${first}</option>`:'')+arr.map(x=>`<option>${x}</option>`).join('');
opts($('fc'),CITIES,'كل المدن');opts($('fk'),CATS,'كل الأنواع');opts($('a_city'),CITIES);opts($('a_cat'),CATS);
$('hwa').onclick=()=>open('https://wa.me/'+ADMIN_WA,'_blank');
let items=[],deal='';
async function load(){
 const {data,error}=await sb.from('aqar_listings').select('*').eq('status','approved').order('created_at',{ascending:false});
 if(error){$('grid').innerHTML='<div class="empty">تعذر تحميل العقارات.<br><small>'+esc(error.message)+'</small></div>';return}
 items=data;render();openHash();
}
function render(){
 let r=items.filter(l=>(!deal||l.deal==deal)&&(!$('fc').value||l.city==$('fc').value)&&(!$('fk').value||l.category==$('fk').value)&&(!$('fp').value||(l.currency=='LYD'&&l.price<=+$('fp').value)));
 const s=$('fs').value;if(s=='lo')r.sort((a,b)=>a.price-b.price);if(s=='hi')r.sort((a,b)=>b.price-a.price);
 $('cnt').textContent=r.length+' عقار';
 $('grid').innerHTML=r.length?r.map(l=>`<div class="card" tabindex="0" data-id="${l.id}">${l.photos?.[0]?`<img loading="lazy" src="${esc(l.photos[0])}" alt="">`:'<div class="ph"></div>'}<div class="in"><span class="tag">${esc(l.deal)}</span>${l.verified?'<span class="vb">✓ موثّق</span>':''}<b>${esc(l.category)}</b><div class="price">${money(l)}</div><div class="mut">${esc(l.city)}${l.area?' - '+esc(l.area):''}</div></div></div>`).join(''):'<div class="empty">ما فيه عقارات بهذي المواصفات.<br>جرب مدينة ثانية، أو خلي الإدارة تدور لك.<br><button class="btn g" id="req2" style="margin-top:12px">اطلب عقارك</button></div>';
}
const syncCats=()=>document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('on',c.dataset.k==$('fk').value));
['fc','fk','fp','fs'].forEach(i=>$(i).oninput=()=>{syncCats();render()});
$('cats').onclick=e=>{const c=e.target.closest('.cat');if(!c)return;$('fk').value=$('fk').value==c.dataset.k?'':c.dataset.k;syncCats();render()};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;deal=b.dataset.d;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x==b));render()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.modal').classList.remove('on');if(location.hash.startsWith('#p-'))history.replaceState(null,'',location.pathname)});
let dmap;
function showItem(l){history.replaceState(null,'','#p-'+l.id);
 $('dbody').innerHTML=`<h2>${esc(l.category)} لل${esc(l.deal)} في ${esc(l.city)}</h2>${l.verified?'<div class="vb b2">✓ موثّق من الإدارة</div>':''}${l.photos?.[0]?`<img class="big" id="bigp" src="${esc(l.photos[0])}" alt="">`:''}<div class="thumbs">${(l.photos||[]).map(p=>`<img src="${esc(p)}" alt="" onclick="bigp.src=this.src">`).join('')}</div><div class="price">${money(l)}</div><p class="mut">${esc(l.city)}${l.area?' - '+esc(l.area):''}</p><p>${esc(l.description)}</p>${l.lat?'<div id="dm"></div>':''}<button class="btn wa" id="dwa" style="width:100%;margin-top:12px;padding:14px">تواصل واتساب</button><button class="btn o" id="dsh" style="width:100%;margin-top:8px">شارك العقار</button>`;
 $('dmod').classList.add('on');$('dsh').onclick=()=>shareL(l);
 $('dwa').onclick=()=>open('https://wa.me/'+wa(l.phone)+'?text='+encodeURIComponent('السلام عليكم، شفت إعلانك في عقارك ('+l.category+' لل'+l.deal+' في '+l.city+')'),'_blank');
 if(l.lat){setTimeout(()=>{dmap&&dmap.remove();dmap=L.map('dm').setView([l.lat,l.lng],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(dmap);L.marker([l.lat,l.lng]).addTo(dmap)},50)}
}
function shareL(l){const url=location.origin+location.pathname+'#p-'+l.id,t=l.category+' لل'+l.deal+' في '+l.city+' - '+money(l);
 if(navigator.share)navigator.share({title:'عقارك',text:t,url}).catch(()=>{});else open('https://wa.me/?text='+encodeURIComponent(t+'\n'+url),'_blank')}
function openHash(){const m=location.hash.match(/^#p-(.+)$/);if(m){const l=items.find(x=>String(x.id)==m[1]);if(l)showItem(l)}}
const openReq=()=>$('rmod').classList.add('on');
$('reqb').onclick=openReq;
$('grid').onclick=e=>{if(e.target.closest('#req2'))return openReq();const c=e.target.closest('.card');if(!c)return;showItem(items.find(x=>x.id==c.dataset.id))};
opts($('r_city'),CITIES);opts($('r_cat'),CATS,'أي نوع');
$('rsend').onclick=async()=>{const g=i=>$(i).value.trim(),phone=g('r_phone');
 if(phone.replace(/\D/g,'').length<9)return toast('اكتب رقم واتساب صحيح');
 $('rsend').disabled=true;
 const {error}=await sb.from('aqar_requests').insert({deal:g('r_deal'),category:g('r_cat'),city:g('r_city'),budget:g('r_budget')||null,currency:g('r_cur'),notes:g('r_notes'),name:g('r_name'),phone});
 $('rsend').disabled=false;
 if(error)return toast('صار خطأ: '+error.message);
 $('rmod').classList.remove('on');toast('وصل طلبك. الإدارة بتتواصل معاك لما يتوفر عقار مناسب.')};
let pmap,pmk,pos=null;
function setPos(ll){pos=ll;pmk?pmk.setLatLng(ll):pmk=L.marker(ll).addTo(pmap)}
$('add').onclick=()=>{$('amod').classList.add('on');setTimeout(()=>{if(!pmap){pmap=L.map('pm').setView([32.4,15],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(pmap);pmap.on('click',e=>setPos(e.latlng))}pmap.invalidateSize()},80)};
$('loc').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);setPos(ll);pmap.setView(ll,15)},()=>toast('ما قدرنا نحدد موقعك. اضغط على الخريطة.'));
$('send').onclick=async()=>{
 const g=i=>$(i).value.trim(),phone=g('a_phone');
 if(!phone||phone.replace(/\D/g,'').length<9)return toast('اكتب رقم واتساب صحيح');
 if(!pos)return toast('حدد موقع العقار على الخريطة');
 const files=[...$('a_ph').files].slice(0,5);if(!files.length)return toast('أضف صورة وحدة على الأقل');
 $('send').disabled=true;$('send').textContent='جاري الإرسال...';
 try{
  const urls=[];
  for(const f of files){const n=crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');const {error}=await sb.storage.from('aqar-photos').upload(n,f);if(error)throw error;urls.push(sb.storage.from('aqar-photos').getPublicUrl(n).data.publicUrl)}
  const {data:{session}}=await sb.auth.getSession();const {error}=await sb.from('aqar_listings').insert({status:session?'approved':'pending',deal:g('a_deal'),category:g('a_cat'),city:g('a_city'),area:g('a_area'),price:g('a_price')||null,currency:g('a_cur'),description:g('a_desc'),owner_name:g('a_name'),phone,lat:pos.lat,lng:pos.lng,photos:urls});
  if(error)throw error;
  $('amod').classList.remove('on');if(session){toast('تم نشر العقار.');load();adminUI()}else toast('وصل طلبك. الإدارة بتتواصل معاك على واتساب.');
 }catch(e){toast('صار خطأ في الإرسال. حاول مرة ثانية.')}
 $('send').disabled=false;$('send').textContent='أرسل الطلب للإدارة';
};
/* لوحة الإدارة: افتح الرابط مع #admin */
async function adminUI(){
 $('adm').classList.add('on');
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('abody').innerHTML='<div class="f"><label>البريد</label><input id="em" type="email"><label>كلمة السر</label><input id="pw" type="password"><button class="btn g" id="lg" style="width:100%;margin-top:12px">دخول</button></div>';
  $('lg').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});error?toast('خطأ: '+error.message):adminUI()};return}
 const {data,error:qe}=await sb.from('aqar_listings').select('*').order('created_at',{ascending:false});
 if(qe){$('abody').innerHTML='<div class="note">تم الدخول، لكن تعذر قراءة الطلبات:<br><b>'+esc(qe.message)+'</b></div><button class="btn o" id="lo">تسجيل خروج</button>';$('lo').onclick=async()=>{await sb.auth.signOut();adminUI()};return}
 const used=new Set(data.filter(l=>l.status=='approved'||l.status=='done').map(l=>wa(l.phone))).size;
 const lab={pending:'جديد',approved:'منشور',rejected:'مرفوض',done:'منتهي'};
 const {data:rq}=await sb.from('aqar_requests').select('*').order('created_at',{ascending:false});
 const rl=(rq||[]).filter(r=>r.status!='done');
 const reqHtml=rl.length?`<h3 style="margin:10px 0 6px">طلبات العقارات (${rl.length})</h3>`+rl.map(r=>`<div class="adm"><span class="tag">طلب</span><b>${esc(r.category||'أي نوع')} لل${esc(r.deal)}</b> - ${esc(r.city)}<div>${r.budget?'الميزانية: '+Number(r.budget).toLocaleString('ar-LY')+(r.currency=='USD'?' دولار':' د.ل'):'بدون ميزانية'}</div><div class="mut">${esc(r.name)} - ${esc(r.phone)}</div><p>${esc(r.notes)}</p><div class="bt"><button class="btn wa" onclick="open('https://wa.me/${wa(r.phone)}')">واتساب</button><button class="btn g" data-rs="done" data-id="${r.id}">تم</button><button class="btn r" data-rdel="${r.id}">حذف</button></div></div>`).join(''):'';
 $('abody').innerHTML=`<div class="note">المشتركون المعتمدون: <b>${used} / ${FREE}</b> (المجاني)</div><button class="btn g" id="ad" style="width:100%;margin-bottom:10px">+ أضف عقار (ينشر مباشرة)</button>${reqHtml}${data.length?'':'<div class="empty">ما فيه طلبات لحد الحين. الطلبات الجديدة بتظهر هنا.</div>'}`+data.map(l=>`<div class="adm"><span class="tag">${lab[l.status]}</span>${l.verified?'<span class="vb">✓ موثّق</span>':''}<b>${esc(l.category)} لل${esc(l.deal)}</b> - ${esc(l.city)}<div>${money(l)}</div><div class="mut">${esc(l.owner_name)} - ${esc(l.phone)}</div><p>${esc(l.description)}</p><div class="thumbs">${(l.photos||[]).map(p=>`<img src="${esc(p)}" alt="">`).join('')}</div><div class="bt"><button class="btn wa" onclick="open('https://wa.me/${wa(l.phone)}')">واتساب المالك</button><button class="btn g" data-s="approved" data-id="${l.id}">نشر</button><button class="btn o" data-v="${l.verified?0:1}" data-id="${l.id}">${l.verified?'إلغاء التوثيق':'توثيق ✓'}</button><button class="btn o" data-s="done" data-id="${l.id}">تم البيع/الإيجار</button><button class="btn r" data-s="rejected" data-id="${l.id}">رفض</button><button class="btn r" data-del="${l.id}">حذف</button></div></div>`).join('')+'<button class="btn o" id="lo">تسجيل خروج</button>';
 $('abody').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id=='ad'){$('adm').classList.remove('on');return $('add').click()}
  if(b.id=='lo'){await sb.auth.signOut();return adminUI()}
  if(b.dataset.rs){await sb.from('aqar_requests').update({status:b.dataset.rs}).eq('id',b.dataset.id);return adminUI()}
  if(b.dataset.rdel){if(!confirm('حذف الطلب؟'))return;await sb.from('aqar_requests').delete().eq('id',b.dataset.rdel);return adminUI()}
  if(b.dataset.v!==undefined){await sb.from('aqar_listings').update({verified:b.dataset.v=='1'}).eq('id',b.dataset.id);adminUI();load();return}
  if(b.dataset.s){await sb.from('aqar_listings').update({status:b.dataset.s}).eq('id',b.dataset.id)}
  else if(b.dataset.del){if(!confirm('حذف نهائي؟'))return;await sb.from('aqar_listings').delete().eq('id',b.dataset.del)}else return;
  adminUI();load()};
}
if(location.hash=='#admin')adminUI();
addEventListener('hashchange',()=>{if(location.hash=='#admin')adminUI();else openHash()});
load();
</script>
</body>
</html>
